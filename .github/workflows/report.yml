name: Report PDF

on:
  push:
    paths:
      - REPORT.md
      - Makefile
      - .github/workflows/report.yml
    tags:
      - 'v*'
  pull_request:
    paths:
      - REPORT.md
      - Makefile
      - .github/workflows/report.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-lang-cyrillic fonts-dejavu-core fonts-dejavu-mono
      - name: Build report
        run: make pdf
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: REPORT.pdf
          if-no-files-found: error
